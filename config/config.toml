[app]
name     = "ffxiv-census"
env      = "production"
base_url = "https://census.ffxivbard.com"

[logging]
default        = "color"
server_default = "color"
level          = "info"

[auth]
enabled = false
token   = "change-me"
routes  = ["/example"]
users   = ["admin:admin:admin|ops"]

[http]
host          = "0.0.0.0"
port          = 8080
read_timeout  = "20s"
write_timeout = "60s"
idle_timeout  = "120s"

[metrics]
endpoint = "graphite.monitoring.svc.cluster.local:8125"
prefix   = "ffxiv-census"

[postgres]
dsn            = "postgres://census:secret@localhost:5432/ffxiv_census?sslmode=disable"
host           = "localhost"
port           = 5432
user           = "census"
password       = "secret"
database       = "ffxiv_census"
sslmode        = "disable"
max_open_conns = 10
max_idle_conns = 5
[rabbitmq]
url      = "amqp://guest:guest@localhost:5672/ffxiv-census"
host     = "localhost"
amqp_port = 5672
user     = "guest"
password = "guest"
vhost    = "ffxiv-census"

[queue]
max_attempts = 50

[writer]
batch_size     = 100
flush_interval = "1s"

[lodestone]
rate_limit = 1.0
max_retries = 1


[proxy]
test_url             = "https://na.finalfantasyxiv.com/lodestone/"
test_timeout         = "10s"
dead_threshold_days  = 2
fail_count_threshold = 5

[proxy.scan]
verification_interval = "60s"
freshness_ttl         = "120s"
recovery_base         = "1m"
recovery_cap          = "15m"
recovery_horizon      = "1h"
weight_verification   = 10
weight_recovery       = 45
weight_background     = 45
lease_duration        = "30s"
min_repeat_interval   = "1s"
inconclusive_retry    = "60s"
control_interval      = "30s"

[proxy.providers]
proxyscrape     = true
proxyscrape_url = "https://api.proxyscrape.com/v4/free-proxy-list/get"
geonode         = true
geonode_url     = "https://proxylist.geonode.com/api/proxy-list"
pubproxy        = true
pubproxy_url    = "http://pubproxy.com/api/proxy"
proxifly         = true
proxifly_url     = "https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols"
thespeedx        = true
thespeedx_url    = "https://raw.githubusercontent.com/TheSpeedX/PROXY-List/master"
monosans         = true
monosans_url     = "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies"
gfpcom           = true
gfpcom_url       = "https://raw.githubusercontent.com/wiki/gfpcom/free-proxy-list/lists"
thordata         = true
thordata_url     = "https://raw.githubusercontent.com/Thordata/awesome-free-proxy-list/main/proxies"
hproxy           = true
hproxy_url       = "https://raw.githubusercontent.com/hproxy-com/free-proxy-list/main"
sage520          = true
sage520_url      = "https://raw.githubusercontent.com/Sage520/Proxy-List/main"
ercindedeoglu    = true
[proxy.consumer]
lock_ttl              = "5m"
lodestone_rate_limit  = 1.0
request_timeout       = "30s"
test_url              = "https://na.finalfantasyxiv.com/lodestone/"
test_timeout          = "10s"
cooldown              = "60s"

[census]
activity_window_days = 30
max_level = 100

[census.ui_stats]
cache_ttl = "1m"
stale_warning = "12h"
refresh_timeout = "2h"


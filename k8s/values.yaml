namespace: default

image:
  repository: mihaiflorentin88/census
  pullPolicy: IfNotPresent
  tag: latest

registry:
  useExistingSecret: true
  secret: "<redacted>"
  secretName: dockerhub

imagePullSecrets:
  - name: dockerhub

serviceAccount:
  create: true
  automount: true
  name: ffxiv-census-sa

persistence:
  enabled: false
  name: ffxiv-census
  accessModes:
    - ReadWriteMany
  size: 10Gi
  storageClass: nfs-rwx

externalPostgres:
  host: pgres-postgresql-rw
  port: "5432"
  database: ffxiv_census

vault:
  enabled: true
  mountPath: kubernetes
  fetchAllDataFrom: census/prod
  authRole: default-namespace
  authServiceAccount: vault-app
  secretPreffix: census
  secretRefreshInterval: 1m
  version: v2
  server: http://vault.default.svc.cluster.local:8200

serviceMonitor:
  enabled: true
  release: monitoring
  interval: 15s
  scrapeTimeout: 10s
  path: /metrics
  # Workers with a metricsPort have no Service, so a PodMonitor scrapes them.
  workers:
    enabled: true

components:
  webserver:
    enabled: true
  workers:
    enabled: true
  cronjobs:
    enabled: true

webserver:
  replicaCount: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationValue: "800m"
    targetMemoryUtilizationValue: "800Mi"
    customMetrics:
      - type: External
        external:
          metric:
            name: http_requests_total
            selector:
              matchLabels:
                service: ffxiv-census
          target:
            type: AverageValue
            averageValue: "100"
  service:
    type: ClusterIP
    port: 80
  containerPort: 8080
  command:
    - /app/ffxiv-census
    - server
    - --start
    - --port
    - "8080"
  resources:
    requests:
      memory: 100Mi
      cpu: 50m
    limits:
      memory: 1Gi
      cpu: 1
  podSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    runAsNonRoot: true
  securityContext:
    allowPrivilegeEscalation: false
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 20
    periodSeconds: 3
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    httpGet:
      path: /health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 3
  podAnnotations: {}
  podLabels: {}
  env:
    - name: QUEUE_MAX_ATTEMPTS
      value: "50"
    - name: RABBITMQ_URL
      value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
  volumeMounts: []
  volumes: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/common-name: census.ffxivbard.com
      nginx.ingress.kubernetes.io/proxy-connect-timeout: "20"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "20"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "20"
      nginx.ingress.kubernetes.io/proxy-body-size: "12m"
    hosts:
      - host: census.ffxivbard.com
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ffxiv-census
                port:
                  number: 80

workers:
  defaults:
    terminationGracePeriodSeconds: 180
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 1Gi
        cpu: 500m
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      runAsNonRoot: true
    env:
      - name: QUEUE_MAX_ATTEMPTS
        value: "50"
      - name: RABBITMQ_URL
        value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
      # Workers write census data through the per-pod batching writer (one
      # serial flush transaction at a time) plus short proxy lease statements,
      # so 3 connections suffice. Instance env replaces this list wholesale.
      - name: POSTGRES_MAX_OPEN_CONNS
        value: "3"
      - name: POSTGRES_MAX_IDLE_CONNS
        value: "2"
    volumeMounts: []
    volumes: []
  instances:
    # --- Census consumer (all census events + failed retries, rate-limited) ---
    - name: census-consumer
      metricsPort: 9090
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - consume
        - --events
        - "id-sweep,character-census,achievement-census,id-sweep.failed,character-census.failed,achievement-census.failed"
        - -c
        - "10"
    # --- Proxy consumers (per-event-type with proxy rotation) ---
    - name: proxy-id-sweep
      metricsPort: 9090
      replicaCount: 3
      command:
        - /app/ffxiv-census
        - consume
        - id-sweep
        - --proxy
        - -c
        - "30"
      env:
        - name: QUEUE_MAX_ATTEMPTS
          value: "50"
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
        - name: POSTGRES_MAX_OPEN_CONNS
          value: "3"
        - name: POSTGRES_MAX_IDLE_CONNS
          value: "2"
    - name: proxy-character-census
      metricsPort: 9090
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - consume
        - character-census
        - --proxy
        - -c
        - "25"
      env:
        - name: QUEUE_MAX_ATTEMPTS
          value: "50"
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
        - name: POSTGRES_MAX_OPEN_CONNS
          value: "3"
        - name: POSTGRES_MAX_IDLE_CONNS
          value: "2"
    - name: proxy-achievement-census
      metricsPort: 9090
      replicaCount: 2
      command:
        - /app/ffxiv-census
        - consume
        - achievement-census
        - --proxy
        - -c
        - "30"
      env:
        - name: QUEUE_MAX_ATTEMPTS
          value: "50"
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
        - name: POSTGRES_MAX_OPEN_CONNS
          value: "3"
        - name: POSTGRES_MAX_IDLE_CONNS
          value: "2"

    # --- Proxy discovery/scanning ---
    - name: proxy-new
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - proxy
        - consume
        - -c
        - "30"
      env:
        - name: QUEUE_MAX_ATTEMPTS
          value: "50"
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
        - name: POSTGRES_MAX_OPEN_CONNS
          value: "3"
        - name: POSTGRES_MAX_IDLE_CONNS
          value: "2"
    - name: proxy-scan
      replicaCount: 5
      command:
        - /app/ffxiv-census
        - proxy
        - scan
        - -c
        - "150"
      env:
        - name: QUEUE_MAX_ATTEMPTS
          value: "50"
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
        - name: POSTGRES_MAX_OPEN_CONNS
          value: "2"
        - name: POSTGRES_MAX_IDLE_CONNS
          value: "1"
      resources:
        requests:
          memory: 100Mi
          cpu: 500m
        limits:
          memory: 1Gi
          cpu: 1000m
    # --- Census failed queue retry consumer ---
    - name: census-retry
      metricsPort: 9090
      replicaCount: 1
      command:
        - /app/ffxiv-census
        - consume
        - failed
        - --events
        - "id-sweep,character-census,achievement-census"
        - -c
        - "1"
      # Instance env replaces workers.defaults.env wholesale, so the queue
      # vars must be re-declared here. Debug logging exposes the retry
      # worker's failed-queue lifecycle (rabbitmq.failed.*) with canonical
      # event types.
      env:
        - name: LOGGING_LEVEL
          value: "debug"
        - name: QUEUE_MAX_ATTEMPTS
          value: "50"
        - name: RABBITMQ_URL
          value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
        # Republishes failed messages only; no census writes.
        - name: POSTGRES_MAX_OPEN_CONNS
          value: "2"
        - name: POSTGRES_MAX_IDLE_CONNS
          value: "1"

cronjobs:
  defaults:
    restartPolicy: OnFailure
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 500m
    podSecurityContext:
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      runAsNonRoot: true
    env:
      - name: QUEUE_MAX_ATTEMPTS
        value: "50"
      - name: RABBITMQ_URL
        value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq.default.svc.cluster.local:5672/ffxiv-census"
      # Workers write census data through the per-pod batching writer (one
      # serial flush transaction at a time) plus short proxy lease statements,
      # so 3 connections suffice. Instance env replaces this list wholesale.
      - name: POSTGRES_MAX_OPEN_CONNS
        value: "3"
      - name: POSTGRES_MAX_IDLE_CONNS
        value: "2"
    volumeMounts: []
    volumes: []
  instances:
    - name: publish-character
      schedule: "*/2 * * * *"
      command:
        - /app/ffxiv-census
        - publish
        - character-census
        - --limit
        - "300"
        - --older-than
        - "0"

    - name: publish-id-sweep
      schedule: "*/1 * * * *"
      command:
        - /app/ffxiv-census
        - publish
        - id-sweep
        - --auto
        - --count
        - "1200"
        - --chunk-size
        - "1"

    - name: publish-fill-gaps
      schedule: "*/1 * * * *"
      command:
        - /app/ffxiv-census
        - publish
        - id-sweep
        - --fill-gaps
        - --count
        - "300"
        - --chunk-size
        - "1"
    - name: proxy-discover
      schedule: "*/2 * * * *"
      command:
        - /app/ffxiv-census
        - proxy
        - discover
        - --limit
        - "400"

    - name: refresh-ui-stats
      schedule: "17 * * * *"
      concurrencyPolicy: Forbid
      successfulJobsHistoryLimit: 2
      failedJobsHistoryLimit: 3
      activeDeadlineSeconds: 7500
      command:
        - /app/ffxiv-census
        - refresh
        - ui-stats

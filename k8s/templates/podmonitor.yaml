{{- if and .Values.serviceMonitor.enabled .Values.components.workers.enabled (.Values.serviceMonitor.workers | default dict).enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "manifest.fullname" . }}-workers
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "manifest.labels" . | nindent 4 }}
    release: {{ .Values.serviceMonitor.release | default "monitoring" }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "manifest.selectorLabels" . | nindent 6 }}
      tier: worker
      component: worker
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  podMetricsEndpoints:
    - port: metrics
      path: {{ .Values.serviceMonitor.path | default "/metrics" }}
      interval: {{ .Values.serviceMonitor.interval | default "15s" }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
